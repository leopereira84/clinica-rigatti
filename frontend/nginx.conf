# Serves the React build and forwards /api to the backend container, so the
# browser talks to a single origin (no CORS) and the API is not exposed directly.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://backend:3333;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # The chat may take up to 60 s (LLM calls + tools).
    proxy_read_timeout 90s;
    client_max_body_size 200k;
  }

  # Fingerprinted bundles can be cached forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # SPA routes (/produtos, /assistente, ...) fall back to index.html, never cached.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
