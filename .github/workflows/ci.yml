name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm:
    name: Fluxo tradicional (npm) - ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [backend, frontend]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    name: Docker Compose (MongoDB + API + frontend)
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker/ci/compose.ci.yml
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Throwaway values generated for this run only; the LLM is the stub of compose.ci.yml.
      - name: Configuração (.env gerado, sem credenciais reais)
        run: |
          cp .env.example .env
          sed -i "s|^JWT_SECRET=.*|JWT_SECRET=$(openssl rand -hex 32)|" .env
          sed -i "s|^SEED_PASSWORD=.*|SEED_PASSWORD=ci-$(openssl rand -hex 8)|" .env
          echo "SEED_PASSWORD=$(grep '^SEED_PASSWORD=' .env | cut -d= -f2)" >> "$GITHUB_ENV"

      - name: Build das imagens
        run: |
          start=$(date +%s)
          $COMPOSE build
          echo "| Build das imagens (sem cache) | $(( $(date +%s) - start )) s |" >> timings.md

      - name: Subir os containers e aguardar healthchecks
        run: |
          start=$(date +%s)
          $COMPOSE up -d --wait --wait-timeout 180
          echo "| up até todos saudáveis (1ª vez, inclui iniciar o replica set) | $(( $(date +%s) - start )) s |" >> timings.md
          $COMPOSE ps

      - name: Replica set do MongoDB
        run: |
          $COMPOSE exec -T mongo mongosh --quiet --eval 'const s = rs.status(); print(`${s.set}: ${s.members[0].name} ${s.members[0].stateStr}`); if (!db.hello().isWritablePrimary) quit(1)'

      - name: Seed (somente no MongoDB do container)
        run: |
          start=$(date +%s)
          $COMPOSE run --rm seed
          echo "| Seed | $(( $(date +%s) - start )) s |" >> timings.md

      - name: Testes de fumaça
        run: node docker/ci/smoke-test.mjs full

      - name: Reiniciar (down sem -v, depois up) e verificar persistência
        run: |
          $COMPOSE down
          start=$(date +%s)
          $COMPOSE up -d --wait --wait-timeout 180
          echo "| up após reinício (imagens prontas, volume existente) | $(( $(date +%s) - start )) s |" >> timings.md
          node docker/ci/smoke-test.mjs after-restart

      - name: Tempos medidos
        if: always()
        run: |
          { echo "| Etapa | Tempo |"; echo "|---|---|"; cat timings.md 2>/dev/null; } >> "$GITHUB_STEP_SUMMARY"
          cat timings.md 2>/dev/null || true

      - name: Logs dos containers
        if: failure()
        run: $COMPOSE logs --no-color
